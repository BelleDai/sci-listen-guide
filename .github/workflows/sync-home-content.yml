name: Sync Home Content

# 編輯完 Google Sheets 後，到 GitHub → Actions → Sync Home Content → Run workflow 手動執行，
# 不必等每天 09:00 的 Daily Podcast Sync。
# 流程：讀取試算表 → 驗證 → 有變更才 commit、build、部署。
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "有變更時建置並部署到正式站"
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# 與 Daily Podcast Sync 共用，避免兩個流程同時 push / 部署
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Google Sheets → src/content/home → Build → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 驗證失敗會在這一步停下並列出錯誤的分頁與列數，不會寫入或部署任何內容
      - name: Sync home content from Google Sheets
        env:
          HOME_CONTENT_SHEET_ID: ${{ vars.HOME_CONTENT_SHEET_ID }}
        run: npm run sync-home

      - name: Commit home content changes
        id: commit
        run: |
          if git diff --quiet -- src/content/home; then
            echo "Home content is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/home
          git commit -m "chore: sync home content from Google Sheets"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build Next.js
        if: ${{ steps.commit.outputs.changed == 'true' && inputs.deploy }}
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: sci-listen-guide.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: sci-listen-guide
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: sci-listen-guide.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Set up Firebase credentials
        if: ${{ steps.commit.outputs.changed == 'true' && inputs.deploy }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-sa.json

      - name: Deploy to Firebase Hosting
        if: ${{ steps.commit.outputs.changed == 'true' && inputs.deploy }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          npx firebase-tools@latest deploy --only hosting --non-interactive --project sci-listen-guide
