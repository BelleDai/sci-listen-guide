name: Daily Podcast Sync

on:
  schedule:
    # 每天台灣時間 09:00 (UTC+8 → UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # 允許手動觸發（用於初次執行全量爬取）

jobs:
  sync:
    name: Sync RSS → Scrape → Build → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 初次全量爬取最長 60 分鐘

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Set up Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV

      - name: Sync Podcast RSS + Scrape Spotify/Apple links
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: sci-listen-guide
        run: npx tsx scripts/sync-podcast-rss.ts

      - name: Build Next.js (includes public/podcast-list.json → out/)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: sci-listen-guide.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: sci-listen-guide
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: sci-listen-guide.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          npx firebase-tools@latest deploy --only hosting --non-interactive --project sci-listen-guide
